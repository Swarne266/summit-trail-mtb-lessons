<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Trail MTB Lessons | Lessons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header>
    <div class="site-header">
      <span class="site-title">Summit Trail MTB Lessons</span>
      <nav aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="lessons.html" aria-current="page">Lessons</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container">
      <h1>Lesson Packages</h1>
      <p>Choose the package that matches your current skill level. All lessons include a helmet fitting, trail safety briefing, and equipment check.</p>

      <div id="filter-bar" class="filter-bar" role="group" aria-label="Filter lessons by skill level">
        <button type="button" data-level="All">All</button>
        <button type="button" data-level="Beginner">Beginner</button>
        <button type="button" data-level="Intermediate">Intermediate</button>
        <button type="button" data-level="Advanced">Advanced</button>
      </div>
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <p id="favorite-banner" class="favorite-banner" aria-live="polite"></p>

      <div id="lesson-list" class="card-grid"></div>
      <noscript><p>Please enable JavaScript to browse and filter lesson packages.</p></noscript>

      <a href="contact.html" class="btn">Book a Lesson</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Summit Trail MTB Lessons. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/lessons.js"></script>
</body>
</html>
